<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Página Inicial - Práticas TDD 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% load static %}

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .dashboard-card {
      width: 100%;
      max-width: 500px;
      border: none;
      border-radius: 24px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: 0.3s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-4px);
    }

    .dashboard-icon {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2rem;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-action {
      height: 52px;
      border-radius: 14px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .btn-action:hover {
      transform: scale(1.02);
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .logout-btn {
      margin-top: 20px;
    }

    @media (max-width: 576px) {
      .actions-grid {
        grid-template-columns: 1fr;
      }

      .dashboard-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container d-flex justify-content-center align-items-center">
    <div class="card dashboard-card text-center">

      <!-- Ícone -->
      <div class="dashboard-icon">
        <i class="fas fa-link"></i>
      </div>

      <!-- Título -->
      <h2 class="fw-bold mb-2">Painel de Links</h2>

      <p class="text-secondary mb-4">
        Gerencie seus links de forma rápida e organizada.
      </p>

      <!-- Botões -->
      <div class="actions-grid">

        <a href="{% url 'link_create' %}" class="btn btn-primary btn-action">
          <i class="fas fa-plus me-2"></i>
          Cadastrar
        </a>

        <a href="{% url 'link_list' %}" class="btn btn-dark btn-action">
          <i class="fas fa-list me-2"></i>
          Listar
        </a>

      </div>

      <!-- Logout -->
      <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger btn-action w-100 logout-btn">
          <i class="fas fa-sign-out-alt me-2"></i>
          Logout
        </button>
      </form>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
