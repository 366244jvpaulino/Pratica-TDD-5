<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Lista de Links - LinkPedia</title>
  {% load static %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'index.css' %}" rel="stylesheet">
</head>

<body class="page-background">
  <div class="container py-5">
    <div class="card shadow-lg page-card">
      <div class="card-body">
        <h2 class="card-title">Links cadastrados</h2>
        <div class="mb-3">
          <a href="{% url 'link_create' %}" class="btn btn-primary">Cadastrar novo link</a>
          <a href="{% url 'home' %}" class="btn btn-secondary ms-2">Voltar ao painel</a>
        </div>

        {% if links %}
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead>
                <tr>
                  <th>Título</th>
                  <th>Link</th>
                  <th>Observação</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                {% for link in links %}
                  <tr>
                    <td>{{ link.titulo }}</td>
                    <td><a href="{{ link.link }}" target="_blank">{{ link.link }}</a></td>
                    <td>{{ link.observacao|default:'-' }}</td>
                    <td>
                      <a href="{% url 'link_edit' link.pk %}" class="btn btn-sm btn-warning">Editar</a>
                      <a href="{% url 'link_delete' link.pk %}" class="btn btn-sm btn-danger">Excluir</a>
                    </td>
                  </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        {% else %}
          <div class="alert alert-info" role="alert">
            Nenhum link cadastrado ainda.
          </div>
        {% endif %}
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
