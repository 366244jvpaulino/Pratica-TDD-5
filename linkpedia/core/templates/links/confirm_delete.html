<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Excluir Link - LinkPedia</title>
  {% load static %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'index.css' %}" rel="stylesheet">
</head>

<body class="page-background">
  <div class="container py-5">
    <div class="card shadow-lg page-card">
      <div class="card-body">
        <h2 class="card-title">Excluir Link</h2>
        <p>Tem certeza de que deseja excluir o link <strong>{{ link.titulo }}</strong>?</p>
        <form method="POST">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Excluir</button>
          <a href="{% url 'link_list' %}" class="btn btn-secondary ms-2">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
